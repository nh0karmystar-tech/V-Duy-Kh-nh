<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Military English</title><meta name="theme-color" content="#4b5d2a"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Military English"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%96%EF%B8%8F%3C/text%3E%3C/svg%3E"><style>
:root{--bg:#f1f3ec;--card:#fff;--tx:#1d2616;--mu:#5c6652;--ac:#4b5d2a;--ac2:#e3e8d3;--ok:#2e7d32;--bad:#c62828;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141a0f;--card:#1f2818;--tx:#e8ecdf;--mu:#9aa58b;--ac:#9bb35a;--ac2:#2b3620;--ok:#6fcf74;--bad:#ef6f6f}}
:root[data-theme="dark"]{--bg:#141a0f;--card:#1f2818;--tx:#e8ecdf;--mu:#9aa58b;--ac:#9bb35a;--ac2:#2b3620;--ok:#6fcf74;--bad:#ef6f6f}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,sans-serif}
#app{max-width:520px;margin:0 auto;padding:12px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
h3{margin:16px 0 8px;font-size:15px;color:var(--mu)}
.card{background:var(--card);border-radius:14px;padding:12px;margin:8px 0;box-shadow:0 1px 3px #0002}
.big{font-size:26px;font-weight:700;text-align:center;padding:36px 12px}
.big small{display:block;font-size:13px;font-weight:400;color:var(--mu);margin-top:10px}
.bar{height:8px;background:var(--ac2);border-radius:4px;margin:6px 0}.bar i{display:block;height:100%;background:var(--ac);border-radius:4px}
small{color:var(--mu)}
button{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--ac2);border-radius:12px;padding:10px 14px;cursor:pointer}
.pri{background:var(--ac);color:var(--bg);border:0;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{padding:6px 12px;border-radius:20px}.chip.on{background:var(--ac);color:var(--bg)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid button{padding:16px 8px;font-weight:600}
.row{display:flex;gap:8px;align-items:center;margin:8px 0}.row .pri{flex:1}
.opt{display:block;width:100%;margin:6px 0;text-align:left}.opt.ok{background:var(--ok);color:#fff}.opt.bad{background:var(--bad);color:#fff}.opt.sel{outline:2px solid var(--ac)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ans{min-height:56px;border:2px dashed var(--ac2);border-radius:12px;padding:8px;margin:10px 0;display:flex;flex-wrap:wrap;gap:6px}
input{font:inherit;width:100%;box-sizing:border-box;padding:12px;border-radius:12px;border:1px solid var(--ac);background:var(--card);color:var(--tx);margin:8px 0}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ac);color:var(--bg);padding:10px 16px;border-radius:20px;opacity:0;transition:.3s;pointer-events:none}
body{background:var(--bg) radial-gradient(circle at 15% 0%,var(--ac2),transparent 45%) no-repeat fixed}
.hero{background:linear-gradient(135deg,#3b4a22,#5d7430);color:#f3f6e8;border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:0 6px 18px #0003}
.hero .top{margin:0 0 6px}.hero b{font-size:18px;letter-spacing:.5px}.pill{background:#0004;padding:4px 10px;border-radius:20px;font-weight:700;font-size:14px}
.rk{font-size:24px;font-weight:800;margin:4px 0 6px}.hero .bar{background:#0004}.hero .bar i{background:linear-gradient(90deg,#d9e86b,#f5c542)}.hero small{color:#e3ebcf}
h3{text-transform:uppercase;letter-spacing:1px;font-size:12px;margin:20px 0 8px}
.card{border:1px solid var(--ac2);border-left:4px solid var(--ac);animation:pop .25s ease}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
button{transition:transform .1s}button:active{transform:scale(.96)}
.grid{gap:10px}.grid button{min-height:84px;font-size:15px;border:0;color:#fff;border-radius:16px;box-shadow:0 3px 8px #0003}
.grid button:nth-child(1){background:#4b6a2a}.grid button:nth-child(2){background:#2f6f73}.grid button:nth-child(3){background:#8a5a2b}.grid button:nth-child(4){background:#6b4a8c}.grid button:nth-child(5){background:#a33b3b}.grid button:nth-child(6){background:#2f5d9e}.grid button:nth-child(7){background:#3d4a3a}
.chip.on{box-shadow:0 2px 6px #0003}.pri{box-shadow:0 3px 8px #0003}
.opt{padding:14px;font-weight:600}.opt.ok{animation:pulse .4s}.opt.bad{animation:shake .35s}
@keyframes pulse{50%{transform:scale(1.03)}}@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.big{background:linear-gradient(160deg,var(--card),var(--ac2));border-left-width:1px}
.grid button:nth-child(7){background:#2d6a4f}.grid button:nth-child(8){background:#7a6a2a}.grid button:nth-child(9){background:#3d4a3a}.grid button:nth-child(10){background:#7a3b2a}.grid button:nth-child(11){background:#3b5b8a}
#ga{position:relative;height:56vh;min-height:340px;overflow:hidden;border-radius:18px;background:linear-gradient(#cfe8ff,#eaf6ff 60%,#bfe3a8);border:1px solid var(--ac2);touch-action:manipulation}
.bb{position:absolute;width:23%;min-height:56px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:13px;font-weight:700;color:#fff;border-radius:28px;box-shadow:0 4px 10px #0003;padding:6px;box-sizing:border-box;cursor:pointer;animation:wig 1.2s ease-in-out infinite alternate;user-select:none}
@keyframes wig{from{transform:translateX(-4px) rotate(-2deg)}to{transform:translateX(4px) rotate(2deg)}}
.bb.pop{animation:popb .35s forwards}@keyframes popb{to{transform:scale(1.6);opacity:0}}
.bb.bad{background:var(--bad)!important;animation:shake .35s}
#toast{box-shadow:0 4px 12px #0004}
.hero{background-image:repeating-linear-gradient(135deg,#ffffff0d 0 12px,transparent 12px 24px),linear-gradient(135deg,#3b4a22,#5d7430)}
.ico{width:52px;height:52px;border-radius:14px;background:var(--ac2);display:flex;align-items:center;justify-content:center;font-size:30px;flex:none}
.banner{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,var(--ac),#2f3d18);color:#fff;border-radius:18px;padding:14px;margin:6px 0 10px;box-shadow:0 6px 16px #0003}
.banner .e{font-size:40px}.banner b{font-size:18px}.banner small{color:#e3ebcf;display:block}
.wr{gap:12px}.wr b{font-size:17px}
.fe{font-size:64px;line-height:1;margin-bottom:10px;display:block}
.lvb{font-size:11px;font-weight:700;background:var(--ac2);color:var(--ac);padding:2px 7px;border-radius:10px;vertical-align:middle}

function vk(n){S.vw=S.vw||[];S.vx=S.vx||[];const i=S.vw.indexOf(n);if(i<0){S.vw.push(n);if(!S.vx.includes(n)){S.vx.push(n);add(20)}}else S.vw.splice(i,1);save();vid()}
